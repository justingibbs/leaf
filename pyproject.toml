[project]
name = "leaf"
version = "0.1.0"
description = "Local Event-Driven Automation Framework"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",

    # AI
    "pydantic-ai>=0.0.30",

    # Database
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",

    # File watching
    "watchfiles>=1.0.0",

    # Workflow engine
    "temporalio>=1.7.0",

    # Utilities
    "python-slugify>=8.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leaf"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
